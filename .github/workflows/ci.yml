# Module tests need a running core (docs/module-development.md): check out core,
# path-link this package into it, then run the package's suite by path.
# Requires a CORE_REPO_TOKEN secret (read access to forestrylabs/cedar-cms)
# while core is private.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  COMPOSER_ROOT_VERSION: 1.0.0

jobs:
  tests:
    name: Tests (pest against core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - uses: actions/checkout@v4
        with:
          repository: forestrylabs/cedar-cms
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: core

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, gd, intl, zip
          coverage: none

      - name: Link module into core
        working-directory: core
        run: |
          # symlink:false so the tests live under vendor/ (Pest's ->in() path)
          composer config repositories.forms '{"type":"path","url":"../module","options":{"symlink":false}}'
          composer require forestry/cedar-forms-module:@dev --no-interaction

      - name: Prepare environment
        working-directory: core
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i "s#->in('Feature', '../modules');#->in('Feature', '../modules', '../vendor/forestry/cedar-forms-module/tests');#" tests/Pest.php

      - name: Pest
        working-directory: core
        run: php artisan test vendor/forestry/cedar-forms-module/tests
